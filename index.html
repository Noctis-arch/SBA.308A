<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
      <header>
    <h1>Dog Finder</h1>
    <p>Search for dog breeds and learn more about them.</p>
  </header>

  <main>
    <section class="search-section">
      <input
        type="text"
        id="searchInput"
        placeholder="Search a breed like husky, pug, boxer..."
      />
      <button id="searchBtn">Search</button>
      <button id="loadBtn">Load Dogs</button>
    </section>

    <p id="message"></p>

    <section>
      <h2>Dog Results</h2>
      <div id="dogContainer" class="dog-container"></div>
    </section>
  </main>

  <script type="module" src="./javascript/index.js"></script>
</body>
</html>
