<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog Breed Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Dog Breed Gallery</h1>
    <p>Pick a dog breed, view photos, and learn more about it.</p>
  </header>

  <main>
    <section class="control-box">
      <label for="breedSelect">Choose a breed:</label>
      <select id="breedSelect">
        <option value="">Loading breeds...</option>
      </select>
      <button id="likeBtn">Like Current Breed</button>
    </section>

    <p id="message"></p>

    <section id="breedInfo" class="breed-info"></section>

    <section>
      <h2>Breed Photos</h2>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script type="module" src="./Javascript/index.js"></script>
</body>
</html>
